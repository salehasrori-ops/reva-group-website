name: Update availability data

# Mengambil jadwal ketersediaan Rawdah dari AnsarPro API setiap 10 menit,
# lalu menerbitkan availability.json ke branch `data` (satu commit, force push).
# API key tersimpan di repo secret ANSARPRO_API_KEY — tidak pernah masuk kode.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch availability from AnsarPro API
        env:
          API_KEY: ${{ secrets.ANSARPRO_API_KEY }}
        run: |
          START=$(date -u +%F)
          END=$(date -u -d "$(date -u +%Y-%m-01) +3 months -1 day" +%F)
          HTTP=$(curl -sS -o raw.json -w "%{http_code}" \
            -H "Authorization: Bearer $API_KEY" \
            "https://api.rawdahnabawi.com/api/appointments/availability?startDate=$START&endDate=$END")
          if [ "$HTTP" != "200" ]; then
            echo "API returned HTTP $HTTP"
            cat raw.json
            exit 1
          fi
          jq --arg start "$START" --arg end "$END" '{
            generatedAt: (now | todate),
            startDate: $start,
            endDate: $end,
            days: (reduce .slots[] as $s ({};
              .[$s.dateKey][$s.gender] += [[$s.timeSlot, $s.availableCount, (if $s.isAvailable then 1 else 0 end)]]))
          }' raw.json > availability.json
          jq -e '.days' availability.json > /dev/null
          echo "Slots for $(jq '.days | length' availability.json) day(s), $START..$END"

      - name: Publish to data branch
        run: |
          mkdir out
          cp availability.json out/
          cd out
          git init -q -b data
          git config user.name "availability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add availability.json
          git commit -q -m "availability $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
