<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - Reva Group</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/reva-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Gerbang paling awal: tanpa token, halaman ini tidak pernah dirender.
    (function () {
      try {
        var t = localStorage.getItem("rva_token");
        var u = JSON.parse(localStorage.getItem("rva_user") || "null");
        if (!t) { location.replace("masuk.html?next=admin.html"); return; }
        if (!u || (u.role !== "owner" && u.role !== "admin")) { location.replace("akun.html"); }
      } catch (e) {
        location.replace("masuk.html?next=admin.html");
      }
    })();
  </script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <img src="assets/reva-logo.png" alt="Reva Group" />
      </a>
      <nav class="nav-desktop" aria-label="Navigasi utama">
        <a href="reservasi.html" class="nav-pill dark">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Reservasi Rawdah
        </a>
        <a href="akun.html" class="nav-pill outline">
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="nav-akun-label">Akun</span>
        </a>
      </nav>
      <button class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="navMobile">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
    <nav class="nav-mobile" id="navMobile" aria-label="Navigasi seluler">
      <a href="reservasi.html">Reservasi Rawdah</a>
      <a href="akun.html">Akun</a>
    </nav>
  </header>

  <!-- Seluruh isi panel dibangun oleh js/admin.js SETELAH server memverifikasi
       role staf. Tidak ada markup menu di sini. -->
  <div id="adminRoot">
    <div class="auth-wrap">
      <p style="text-align: center; color: var(--muted); font-size: 0.875rem;">Memeriksa akses&hellip;</p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top: 0; border-top: 0; padding-top: 0;">
        <p>PT. Reva Sarif Group</p>
      </div>
    </div>
  </footer>

  <script src="js/site.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
